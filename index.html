<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f8f8f8">
<title>Lexicon</title>
<style>
:root {
  --bg: #ffffff; --bar: #f8f8f8; --card: #ffffff; --text: #1f1f1f; --muted: #616161;
  --border: #e5e5e5; --accent: #c2410c; --on-accent: #ffffff; --chip: #fff1e8;
  --dawn: linear-gradient(90deg, #f59e0b, #ea580c 55%, #dc2626);
  --m: #1d4ed8; --f: #be123c; --n: #15803d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1f1f1f; --bar: #181818; --card: #252526; --text: #e4e4e4; --muted: #a0a0a0;
    --border: #3c3c3c; --accent: #fb923c; --on-accent: #1f1f1f; --chip: #3a2a20;
    --m: #7aa2f7; --f: #f7768e; --n: #73c991;
  }
}
:root[data-theme="dark"] {
  --bg: #1f1f1f; --bar: #181818; --card: #252526; --text: #e4e4e4; --muted: #a0a0a0;
  --border: #3c3c3c; --accent: #fb923c; --on-accent: #1f1f1f; --chip: #3a2a20;
  --m: #7aa2f7; --f: #f7768e; --n: #73c991;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body {
  height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--text);
  font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Segoe UI", sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, select, input { font: inherit; color: inherit; }
button, select, a { cursor: pointer; touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
header {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 6px 16px;
  padding-top: max(6px, env(safe-area-inset-top)); background: var(--bar); border-bottom: 1px solid var(--border);
}
.now {
  display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 8px 0 0; background: none; border: 0;
  font-size: 15px; font-weight: 700; letter-spacing: .08em; transition: color .15s;
}
.flag { display: block; width: 22px; height: 22px; flex: none; border-radius: 3px; stroke: none; box-shadow: 0 0 0 1px var(--border); }
.opts { display: grid; gap: 8px; margin: 8px 0 16px; padding: 0; border: 0; min-width: 0; }
.opts legend { padding: 0; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: var(--muted); }
.opt {
  display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; cursor: pointer;
  border: 1px solid var(--border); border-radius: 4px; transition: border-color .15s;
}
.opt:has(input:checked) { border-color: var(--accent); }
.opt input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); }
.opt small { margin-left: auto; font-size: 13px; color: var(--muted); }
.icon {
  width: 44px; height: 44px; display: grid; place-items: center; background: none; flex: none;
  border: 1px solid var(--border); border-radius: 4px; transition: border-color .15s, color .15s;
}
.icon:disabled { opacity: .35; cursor: default; }
svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.track { height: 3px; background: var(--border); }
#fill { height: 100%; width: 0; background: var(--dawn); transition: width .25s ease-out; }
main { flex: 1; min-height: 0; display: flex; width: 100%; max-width: 640px; margin: 0 auto; }
.view { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; padding: 12px 16px; gap: 12px; }

/* cards */
#pos { margin: 0; font-size: 14px; color: var(--muted); text-align: center; font-variant-numeric: tabular-nums; }
.stage { flex: 1; min-height: 0; perspective: 1400px; touch-action: pan-y; }
@media (pointer: coarse) { .stage { -webkit-user-select: none; user-select: none; } }
#slide { width: 100%; height: 100%; transition: transform .16s ease-out, opacity .16s ease-out; }
#slide.drag { transition: none; }
#card { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .3s ease-out; }
#card.still { transition: none; }
#card.flip { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 20px;
  overflow-y: auto; overscroll-behavior: contain; touch-action: pan-y; cursor: pointer;
}
.front { display: flex; flex-direction: column; align-items: center; text-align: center; }
.front > :first-child { margin-top: auto; }
.front > :last-child { margin-bottom: auto; }
.front h2 { font-size: clamp(32px, 9vw, 48px); line-height: 1.15; margin-bottom: 12px; margin-top: 0; overflow-wrap: anywhere; }
.score { display: block; color: var(--accent); font-size: 14px; font-weight: 600; margin: 0; }
.stars { letter-spacing: 1px; white-space: nowrap; }
.stars span { color: var(--border); }
.stars .on { color: var(--accent); }.lists { color: var(--muted); font-size: 13px; margin: 4px 0 0; }
.hint { color: var(--muted); font-size: 13px; margin: 20px 0 0; }
.back { transform: rotateY(180deg); }
.back h2, .sheet h2 { font-size: 22px; margin: 0 0 8px; overflow-wrap: anywhere; }
.sense { padding: 12px 0; border-top: 1px solid var(--border); cursor: auto; }
.tag { color: var(--accent); font-size: 13px; font-weight: 600; }
.ko { font-size: 18px; font-weight: 600; margin: 2px 0; }
.en { margin: 0 0 8px; color: var(--muted); }
.syns { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.chip { min-height: 36px; padding: 0 12px; background: var(--chip); border: 0; border-radius: 4px; font-size: 14px; }
.ex { margin: 0; font-size: 15px; padding-left: 10px; border-left: 2px solid var(--accent); }
.ex-ko { margin: 2px 0 0; padding-left: 12px; font-size: 14px; color: var(--muted); }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 12px; cursor: auto; }
.part {
  display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 10px; font-size: 14px; background: none;
  border: 1px solid var(--border); border-radius: 4px; cursor: pointer;
}
.part b { font-weight: 600; }
.part span { font-size: 13px; color: var(--muted); }
.part.sep { border-color: var(--accent); }
.origin { flex-basis: 100%; margin: 0; font-size: 13px; color: var(--muted); }
.related { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; }

/* German grammar */
.art { font-weight: 700; }
.g-m { color: var(--m); } .g-f { color: var(--f); } .g-n { color: var(--n); }
.pre { color: var(--accent); }
.dot { color: var(--muted); font-weight: 400; margin: 0 .15em; }
.refl { color: var(--muted); font-weight: 400; }
.gline { margin: 0; font-size: 15px; color: var(--muted); }
.gtable { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 0 0 12px; font-size: 15px; cursor: auto; }
.gtable dt { color: var(--muted); }
.gtable dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.badge { display: inline-block; padding: 0 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 12px; color: var(--muted); }

.controls { display: flex; gap: 8px; }
#flip {
  flex: 1; min-height: 44px; font-weight: 600; background: var(--accent); color: var(--on-accent);
  border: 0; border-radius: 4px; transition: opacity .15s;
}

/* day grid and word list */
.title { font-size: 18px; font-weight: 600; margin: 0; }
.sub { font-size: 14px; color: var(--muted); margin: 0; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
.level { font-size: 15px; font-weight: 600; margin: 16px 0 8px; }
.level:first-child { margin-top: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; align-content: start; }
.day {
  display: flex; flex-direction: column; justify-content: center; min-height: 64px; padding: 8px 12px;
  color: inherit; text-decoration: none; background: var(--card); border: 1px solid var(--border); border-radius: 4px; transition: border-color .15s;
}
.day b { font-size: 15px; font-weight: 600; }
.day span { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.day.done span { color: var(--accent); font-weight: 600; }
.day.last { border-color: var(--accent); }
.tools { display: flex; gap: 8px; }
.tools input { flex: 1; min-width: 0; }
.tools input, .tools select { min-height: 44px; padding: 0 12px; background: var(--card); border: 1px solid var(--border); border-radius: 4px; }
.row {
  display: grid; grid-template-columns: minmax(0, 42%) minmax(0, 1fr) auto; gap: 8px; align-items: center; width: 100%; min-height: 48px;
  padding: 4px 0; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--border);
  content-visibility: auto; contain-intrinsic-size: auto 48px;
}
.row .w { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { font-size: 14px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s { font-size: 13px; color: var(--accent); text-align: right; font-variant-numeric: tabular-nums; }

/* tabs */
.tabs { display: flex; background: var(--bar); border-top: 1px solid var(--border); padding-bottom: env(safe-area-inset-bottom); }
.tabs a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  min-height: 52px; color: var(--muted); font-size: 12px; text-decoration: none; transition: color .15s;
}
.tabs a[aria-current="page"] { color: var(--accent); font-weight: 600; }

/* popup sheet */
dialog {
  width: 100%; max-width: 640px; max-height: 72dvh; margin: auto auto 0; padding: 0; color: var(--text); background: var(--card);
  border: 1px solid var(--border); border-radius: 12px 12px 0 0;
}
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(0, 0, 0, .45); }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; padding: 12px 16px 4px; }
.sheet { overflow-y: auto; overscroll-behavior: contain; padding: 0 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
.note { font-size: 13px; color: var(--muted); margin: 8px 0 0; }
@media (min-width: 640px) { dialog { margin: auto; border-radius: 8px; } }
@media (max-height: 480px) {
  .face { padding: 12px; }
  .front h2 { font-size: 32px; margin-bottom: 4px; }
  .hint { display: none; }
}
@media (hover: hover) {
  .icon:hover:not(:disabled), .tabs a:hover { border-color: var(--accent); color: var(--accent); }
  .now:hover { color: var(--accent); }
  .opt:hover { border-color: var(--accent); }
  .day:hover { border-color: var(--accent); }
  #flip:hover { opacity: .9; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <button class="now" id="now" aria-label="학습 언어 바꾸기">
    <span id="flag" aria-hidden="true"></span><span id="now-name">ENGLISH</span>
  </button>
  <button class="icon" id="settings-btn" aria-label="설정">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
  </button>
</header>
<div class="track"><div id="fill"></div></div>
<main>
  <section class="view" id="view-cards" hidden>
    <p id="pos" aria-live="polite">불러오는 중…</p>
    <div class="stage" id="stage">
      <div id="slide">
        <div id="card">
          <div class="face front" id="front"></div>
          <div class="face back" id="back"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="icon" id="prev" aria-label="이전 단어"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
      <button id="flip">뜻 보기</button>
      <button class="icon" id="next" aria-label="다음 단어"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
    </div>
  </section>
  <section class="view" id="view-days" hidden>
    <p class="title" id="days-title"></p>
    <p class="sub" id="days-sub"></p>
    <div class="scroll" id="grid"></div>
  </section>
  <section class="view" id="view-list" hidden>
    <div class="tools">
      <input id="q" type="search" placeholder="단어 또는 뜻 검색" aria-label="단어 또는 뜻 검색" autocomplete="off" autocapitalize="off" spellcheck="false">
      <select id="sort" aria-label="정렬 기준">
        <option value="abc">A–Z</option>
        <option value="score">Importance</option>
      </select>
    </div>
    <p class="sub" id="count" aria-live="polite"></p>
    <div class="scroll" id="rows"></div>
  </section>
</main>
<nav class="tabs" aria-label="주요 메뉴">
  <a data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v4M4.9 8.9l1.4 1.4M2 18h2M20 18h2M17.7 10.3l1.4-1.4M22 22H2M16 18a4 4 0 0 0-8 0"/></svg>오늘의 10단어</a>
  <a data-tab="days"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><span id="days-tab">Day별</span></a>
  <a data-tab="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>전체 단어</a>
</nav>
<dialog id="sheet" aria-labelledby="sheet-word">
  <div class="sheet-head">
    <h2 id="sheet-word"></h2>
    <button class="icon" id="sheet-close" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sheet" id="sheet-body"></div>
</dialog>
<dialog id="settings" aria-labelledby="settings-title">
  <div class="sheet-head">
    <h2 id="settings-title">설정</h2>
    <button class="icon" id="settings-close" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="sheet">
    <fieldset class="opts">
      <legend>학습 언어</legend>
      <label class="opt"><input type="radio" name="lang" value="en"><span data-flag="en"></span>English<small>GRE · 2,713단어</small></label>
      <label class="opt"><input type="radio" name="lang" value="de"><span data-flag="de"></span>Deutsch<small>A1–B1 · 2,915단어</small></label>
    </fieldset>
    <fieldset class="opts">
      <legend>테마</legend>
      <label class="opt"><input type="radio" name="theme" value="system">기기 설정 따르기</label>
      <label class="opt"><input type="radio" name="theme" value="light">밝게</label>
      <label class="opt"><input type="radio" name="theme" value="dark">어둡게</label>
    </fieldset>
  </div>
</dialog>
<script>
const TODAY_COUNT = 10;
const FLAGS = {
  // square flags, drawn inline so they need no image files
  en: '<svg class="flag" viewBox="0 0 14 14"><rect width="14" height="14" fill="#fff"/><path d="M0 0h14v2H0zM0 4h14v2H0zM0 8h14v2H0zM0 12h14v2H0z" fill="#B22234"/><rect width="7" height="8" fill="#3C3B6E"/><g fill="#fff"><circle cx="1.75" cy="2" r=".5"/><circle cx="3.5" cy="2" r=".5"/><circle cx="5.25" cy="2" r=".5"/><circle cx="2.6" cy="4" r=".5"/><circle cx="4.4" cy="4" r=".5"/><circle cx="1.75" cy="6" r=".5"/><circle cx="3.5" cy="6" r=".5"/><circle cx="5.25" cy="6" r=".5"/></g></svg>',
  de: '<svg class="flag" viewBox="0 0 3 3"><rect width="3" height="1" fill="#000"/><rect y="1" width="3" height="1" fill="#DD0000"/><rect y="2" width="3" height="1" fill="#FFCE00"/></svg>',
};
const LANGS = {
  en: { name: "ENGLISH", title: "Lexicon GRE", words: "words.json", parts: "en/roots.json", perDay: 50, daysTab: "Day별",
        daysSub: "하루 50단어, 중요도가 높은 단어부터 나옵니다.", key: "" },
  de: { name: "DEUTSCH", title: "Lexicon Deutsch", words: "words-de.json", parts: "de/parts.json", perDay: 20, daysTab: "레벨별",
        daysSub: "하루 20단어, 레벨 안에서 자주 쓰는 단어부터 나옵니다.", key: "-de" },
};
const NAMES = { VocabCom: "Vocabulary.com" };
const PART_NAMES = { prefix: "접두사", root: "어근", suffix: "접미사", sep: "분리 전철", insep: "비분리 전철", stem: "기본 단어" };
const GENDER = { m: ["der", "남성"], f: ["die", "여성"], n: ["das", "중성"] };
const CLASS = { weak: "규칙 변화 (약변화)", strong: "불규칙 변화 (강변화)", mixed: "혼합 변화", irregular: "불규칙 변화", modal: "화법조동사 (불규칙)" };
const AUX = { haben: "hat", sein: "ist", "haben/sein": "hat/ist" };
const POS_KO = { noun: "명사", verb: "동사", adj: "형용사", adv: "부사", prep: "전치사", conj: "접속사", pron: "대명사", det: "관사·한정사", num: "수사", intj: "감탄사", particle: "불변화사", phrase: "구" };
const $ = (id) => document.getElementById(id);
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
// 중요도 → 별 3개 (0-40: 1, 40-60: 2, 60-80: 2 + 테두리 별, 80-100: 3)
function stars(score, cls = "") {
  const n = score < 40 ? 1 : score < 60 ? 2 : score < 80 ? 2.5 : 3;
  const s = el("span", `stars ${cls}`);
  s.setAttribute("role", "img");
  s.setAttribute("aria-label", `중요도 별 ${n}개`);
  for (let i = 1; i <= 3; i++) s.append(i <= n ? el("span", "on", "★") : i - 0.5 === n ? el("span", "on", "☆") : el("span", "", "★"));
  return s;
}
const getJSON = (url) => fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });

let lang = "en", cfg = LANGS.en, words = [], byWord = new Map(), parts = {}, extra = null;
const cache = {};
let deck = null, idx = 0, flipped = false, busy = false;
const calm = matchMedia("(prefers-reduced-motion: reduce)");
const isDone = () => idx === deck.list.length;
const canGo = (delta) => (delta > 0 ? !isDone() : idx > 0);
const skey = (k) => k + cfg.key;

async function useLang(l) {
  lang = LANGS[l] ? l : "en";
  cfg = LANGS[lang];
  if (!cache[lang]) {
    const [w, p] = await Promise.all([getJSON(cfg.words), getJSON(cfg.parts).catch(() => ({}))]);
    cache[lang] = { words: w, parts: p, byWord: new Map(w.map((x) => [x.word.toLowerCase(), x])), rows: null };
  }
  ({ words, parts, byWord } = cache[lang]);
  document.title = cfg.title;
  document.documentElement.lang = lang === "de" ? "ko" : "ko";
  $("days-tab").textContent = cfg.daysTab;
  $("flag").innerHTML = FLAGS[lang];
  $("now-name").textContent = cfg.name;
  document.querySelectorAll(".tabs a").forEach((a) => { a.href = `#/${lang}/${a.dataset.tab}`; });
}

/* day groups: GRE is one run of days; German restarts the day count in each level */
function groups() {
  const levels = lang === "de" ? ["a1", "a2", "b1"] : [null];
  return levels.map((lv) => {
    const list = lv ? words.filter((w) => w.level === lv) : words;
    const ds = [];
    for (let i = 0; i < list.length; i += cfg.perDay) ds.push({ id: `${lv ? lv + "-" : ""}${ds.length + 1}`, n: ds.length + 1, lv, list: list.slice(i, i + cfg.perDay) });
    return { lv, days: ds };
  });
}
const allDays = () => groups().flatMap((g) => g.days);
const dayTitle = (d) => (d.lv ? `${d.lv.toUpperCase()} Day ${d.n}` : `Day ${d.n}`);

function dayDeck(id) {
  const ds = allDays();
  const i = Math.max(0, ds.findIndex((d) => d.id === id));
  const d = ds[i], next = ds[i + 1];
  const p = (store.get(skey("prog")) || {})[d.id];
  return {
    title: dayTitle(d), list: d.list, start: p && !p.done ? Math.min(p.i, d.list.length - 1) : 0,
    doneLabel: next ? `${dayTitle(next)} 시작` : "목록으로", doneHash: next ? `#/${lang}/day/${next.id}` : `#/${lang}/days`,
    save(j) {
      const all = store.get(skey("prog")) || {};
      all[d.id] = { i: j >= d.list.length ? 0 : j, done: all[d.id]?.done || j >= d.list.length };
      store.set(skey("prog"), all);
      store.set(skey("lastDay"), d.id);
    },
  };
}

function fnv(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}

function todayDeck() {
  const d = new Date();
  const date = `${d.getFullYear()}-${d.getMonth() + 1}-${d.getDate()}`;
  let pool;
  if (lang === "de") {
    // the level of the day studied most recently, A1 to start with
    const lv = String(store.get(skey("lastDay")) || "a1").split("-")[0];
    pool = words.filter((w) => w.level === lv);
  } else {
    pool = words.slice(0, Math.ceil(words.length / 2)); // words is sorted by importance
  }
  const list = pool.map((w) => [fnv(date + w.word), w]).sort((a, b) => a[0] - b[0]).slice(0, TODAY_COUNT).map((x) => x[1]);
  const s = store.get(skey("today"));
  return {
    title: "오늘의 단어", list, start: s?.date === date ? Math.min(s.i, list.length) : 0,
    doneLabel: `${cfg.daysTab} 학습으로`, doneHash: `#/${lang}/days`,
    save(i) { store.set(skey("today"), { date, i }); },
  };
}

/* word display */
function headword(w) {
  const h = el("span");
  const g = w.grammar || {};
  if (g.type === "noun" && g.gender?.length) {
    const arts = g.gender.map((x) => GENDER[x][0]);
    if (g.number === "pl") h.append(el("span", "art g-f", "die"), " ");
    else {
      g.gender.forEach((x, i) => {
        if (i) h.append(el("span", "dot", "/"));
        h.append(el("span", `art g-${x}`, arts[i]));
      });
      h.append(" ");
    }
    h.append(w.word);
  } else if (g.type === "verb") {
    if (g.reflexive) h.append(el("span", "refl", "sich "));
    if (g.separable) h.append(el("span", "pre", g.prefix), el("span", "dot", "·"), w.word.slice(g.prefix.length));
    else h.append(w.word);
  } else h.append(w.word);
  return h;
}

function grammarLine(w) {
  const g = w.grammar || {};
  if (g.type === "noun") {
    if (g.number === "pl") return "복수형으로만 씀";
    const gender = (g.gender || []).map((x) => GENDER[x][1]).join("·");
    return [gender, g.plural ? `복수 die ${g.plural}` : "복수 없음"].filter(Boolean).join(" · ");
  }
  if (g.type === "verb") return [g.separable ? "분리동사" : null, CLASS[g.class]].filter(Boolean).join(" · ") || "동사";
  return POS_KO[g.type] || "";
}

function grammarTable(w) {
  const g = w.grammar || {};
  const rows = [];
  if (g.type === "noun" && g.number !== "pl") {
    rows.push(["성", (g.gender || []).map((x) => `${GENDER[x][1]} (${GENDER[x][0]})`).join(", ")]);
    rows.push(["복수", g.plural ? `die ${g.plural}` : "없음"]);
    if (g.genitive) rows.push(["2격", `des ${g.genitive}`]);
  } else if (g.type === "verb") {
    if (g.class) rows.push(["변화", CLASS[g.class]]);
    if (g.separable) rows.push(["분리", `${g.prefix} + ${w.word.slice(g.prefix.length)} · 전철은 문장 끝으로 이동`]);
    // reflexive "sich" goes right after the finite verb: er freut sich, er zieht sich um, er hat sich gefreut
    const withSich = (finite) => (g.reflexive ? finite.replace(/^(\S+)/, "$1 sich") : finite);
    if (g.present3) rows.push(["현재", `er ${withSich(g.present3)}`]);
    if (g.past) rows.push(["과거", `er ${withSich(g.past)}`]);
    if (g.pp) rows.push(["현재완료", `er ${withSich(AUX[g.aux] || "hat")} ${g.pp}`]);
    if (g.aux === "haben/sein") rows.push(["", "이동·상태 변화 뜻이면 ist, 그 밖에는 hat"]);
  } else if (g.type === "adj" && (g.comparative || g.superlative)) {
    if (g.comparative) rows.push(["비교급", g.comparative]);
    if (g.superlative) rows.push(["최상급", `am ${g.superlative}`]);
  }
  if (!rows.length) return [];
  const dl = el("dl", "gtable");
  rows.forEach(([k, v]) => dl.append(el("dt", "", k), el("dd", "", v)));
  return [dl];
}

/* card rendering */
function setFlip(v) {
  flipped = v;
  $("card").classList.toggle("flip", v);
  $("flip").textContent = isDone() ? deck.doneLabel : v ? "단어 보기" : "뜻 보기";
  $("front").inert = v;
  $("back").inert = !v;
  if (v) $("back").scrollTop = 0;
}

function toggle() {
  if (isDone()) location.hash = deck.doneHash;
  else setFlip(!flipped);
}

function resetFlip() {
  const c = $("card");
  c.classList.add("still");
  setFlip(false);
  void c.offsetWidth; // commit the unflipped state so the next word's back never shows mid-rotation
  c.classList.remove("still");
}

function chipList(items, onPick) {
  const wrap = el("div", "syns");
  items.forEach((x) => {
    const b = el("button", "chip", x);
    b.type = "button";
    b.onclick = () => onPick(x);
    wrap.append(b);
  });
  return wrap;
}

function senseBox(s) {
  const box = el("div", "sense");
  if (s.pos) box.append(el("span", "tag", s.pos));
  if (s.ko) box.append(el("p", "ko", s.ko));
  if (s.en) box.append(el("p", "en", s.en));
  if (s.synonyms?.length) box.append(chipList(s.synonyms, showWord));
  (s.examples || []).slice(0, 2).forEach((x) => {
    box.append(el("p", "ex", x.text));
    if (x.ko) box.append(el("p", "ex-ko", x.ko));
  });
  return box;
}

function wordMeta(w) {
  if (!w.parts?.length && !w.origin) return [];
  const meta = el("div", "meta");
  (w.parts || []).forEach((key) => {
    const info = parts[key];
    const b = el("button", `part ${info?.type || ""}`);
    b.type = "button";
    b.append(el("b", "", info?.form || key.replace(/\(.*\)$/, "")));
    if (info) b.append(el("span", "", info.ko));
    b.setAttribute("aria-label", `${PART_NAMES[info?.type] || "구성 요소"} ${info?.form || key}`);
    b.onclick = () => showPart(key);
    meta.append(b);
  });
  if (w.origin) {
    meta.append(el("p", "origin", w.origin.ko));
  }
  return [meta];
}

function frontOf(w) {
  const out = [];
  const h = el("h2");
  h.append(headword(w));
  out.push(h);
  if (lang === "de") {
    out.push(el("p", "gline", grammarLine(w)), el("p", "lists", w.level.toUpperCase()));
  } else {
    out.push(stars(w.score, "score"), el("p", "lists", w.lists.map((l) => NAMES[l] || l).join(" · ")));
  }
  return out;
}

function backOf(w) {
  const h = el("h2");
  h.append(headword(w));
  return [h, ...grammarTable(w), ...wordMeta(w), ...w.senses.map(senseBox)];
}

function render() {
  const d = deck.list, w = d[idx];
  $("prev").disabled = !canGo(-1);
  $("next").disabled = !canGo(1);
  deck.save(idx);
  const f = $("front"), b = $("back");
  if (isDone()) {
    $("pos").textContent = `${deck.title} 완료`;
    $("fill").style.width = "100%";
    f.replaceChildren(el("h2", "", `${deck.title} 완료`), el("p", "lists", `${d.length}단어를 모두 넘겼습니다.`));
    b.replaceChildren();
    resetFlip();
    return;
  }
  $("pos").textContent = `${deck.title} · ${idx + 1} / ${d.length}`;
  $("fill").style.width = `${((idx + 1) / d.length) * 100}%`;
  f.replaceChildren(...frontOf(w));
  if (idx === 0) f.append(el("p", "hint", "카드를 누르면 뜻이 보이고, 좌우로 밀면 넘어갑니다."));
  b.replaceChildren(...backOf(w));
  resetFlip();
}

function move(delta) {
  const s = $("slide");
  if (busy) return;
  if (!canGo(delta)) { s.style.transform = ""; return; }
  const step = () => { idx += delta; render(); };
  if (calm.matches) { step(); s.style.transform = ""; return; }
  busy = true;
  s.style.transform = `translateX(${-delta * 110}%)`;
  s.style.opacity = "0";
  setTimeout(() => {
    step();
    s.classList.add("drag");
    s.style.transform = `translateX(${delta * 40}%)`;
    void s.offsetWidth;
    s.classList.remove("drag");
    s.style.transform = "";
    s.style.opacity = "";
    busy = false;
  }, 150);
}

/* popups */
function openSheet(title) {
  const dlg = $("sheet");
  if (typeof title === "string") $("sheet-word").textContent = title;
  else $("sheet-word").replaceChildren(title);
  $("sheet-body").replaceChildren();
  if (!dlg.open) dlg.showModal();
  return $("sheet-body");
}

async function showWord(raw) {
  const word = raw.toLowerCase();
  const entry = byWord.get(word);
  const title = entry ? headword(entry) : raw;
  const body = openSheet(title);
  if (entry) {
    if (lang === "de") body.append(el("p", "gline", `${entry.level.toUpperCase()} · ${grammarLine(entry)}`), ...grammarTable(entry));
    else body.append(stars(entry.score, "score"));
    body.append(...wordMeta(entry), ...entry.senses.map(senseBox));
  } else {
    body.append(el("p", "note", "불러오는 중…"));
    if (!extra) {
      try {
        extra = await getJSON("en/synonyms.json");
      } catch {
        body.replaceChildren(el("p", "note", "뜻을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요."));
        return;
      }
    }
    if ($("sheet-word").textContent !== raw) return;
    const senses = extra[word];
    if (senses) body.replaceChildren(...senses.map(senseBox));
    else body.replaceChildren(el("p", "note", "이 단어의 뜻 정보가 없습니다."));
  }
  body.scrollTop = 0;
}

function showPart(key) {
  const info = parts[key];
  const body = openSheet(info?.form || key);
  if (info) body.append(el("span", "tag", PART_NAMES[info.type] || info.type), el("p", "ko", info.ko));
  if (info?.type === "sep") body.append(el("p", "note", "분리 전철: 문장에서 동사와 떨어져 맨 뒤로 갑니다. 예) Ich rufe dich an."));
  if (info?.type === "insep") body.append(el("p", "note", "비분리 전철: 동사에 항상 붙어 있고, 과거분사에 ge-가 붙지 않습니다."));
  const others = words.filter((w) => w.parts?.includes(key)).map((w) => w.word).sort((a, b) => a.localeCompare(b));
  body.append(el("p", "note", `이 요소가 포함된 단어 ${others.length}개`));
  const wrap = chipList(others, showWord);
  wrap.className = "related";
  body.append(wrap);
  body.scrollTop = 0;
}

$("sheet-close").onclick = () => $("sheet").close();
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").close(); });

/* day grid */
function renderDays() {
  const prog = store.get(skey("prog")) || {}, last = store.get(skey("lastDay"));
  $("days-title").textContent = lang === "de" ? "레벨별 단어장" : "Day별 단어장";
  $("days-sub").textContent = cfg.daysSub;
  const out = [];
  for (const g of groups()) {
    if (g.lv) out.push(el("p", "level", `${g.lv.toUpperCase()} · ${g.days.reduce((s, d) => s + d.list.length, 0)}단어`));
    const grid = el("div", "grid");
    for (const d of g.days) {
      const a = el("a", "day");
      a.href = `#/${lang}/day/${d.id}`;
      const p = prog[d.id];
      if (p?.done) a.classList.add("done");
      if (d.id === String(last)) a.classList.add("last");
      a.append(el("b", "", `Day ${d.n}`), el("span", "", p?.done ? "완료" : p?.i ? `${p.i + 1} / ${d.list.length}` : `${d.list.length}단어`));
      grid.append(a);
    }
    out.push(grid);
  }
  $("grid").replaceChildren(...out);
}

/* word list */
function buildRows() {
  return words.map((w) => {
    const b = el("button", "row");
    b.type = "button";
    const gloss = w.senses.map((s) => s.ko || s.en).join(" / ");
    const name = el("span", "w");
    name.append(headword(w));
    b.append(name, el("span", "m", gloss), lang === "de" ? el("span", "s", w.level.toUpperCase()) : stars(w.score, "s"));
    b.onclick = () => showWord(w.word);
    return { w, b, text: `${w.word} ${gloss}`.toLowerCase() };
  });
}

function sortRows() {
  const key = $("sort").value, rows = cache[lang].rows;
  const rank = new Map(words.map((w, i) => [w, i]));
  const sorted = [...rows].sort((a, b) => (key === "score" ? rank.get(a.w) - rank.get(b.w) : a.w.word.localeCompare(b.w.word, lang)));
  $("rows").replaceChildren(...sorted.map((r) => r.b));
  $("rows").scrollTop = 0;
}

function filterRows() {
  const q = $("q").value.trim().toLowerCase();
  let n = 0;
  for (const r of cache[lang].rows) {
    r.b.hidden = !!q && !r.text.includes(q);
    n += r.b.hidden ? 0 : 1;
  }
  $("count").textContent = `${n.toLocaleString()}단어`;
}

$("q").addEventListener("input", filterRows);
$("sort").addEventListener("change", sortRows);

/* routing: #/<lang>/<view>[/<day id>] */
function show(view, tab) {
  for (const v of ["cards", "days", "list"]) $(`view-${v}`).hidden = v !== view;
  document.querySelectorAll(".tabs a").forEach((a) => {
    if (a.dataset.tab === tab) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  });
}

function openDeck(d, tab) {
  deck = d;
  idx = d.start;
  show("cards", tab);
  render();
}

async function route() {
  if ($("sheet").open) $("sheet").close();
  let [l, view, arg] = location.hash.replace(/^#\/?/, "").split("/");
  if (!LANGS[l]) { [view, arg] = [l, view]; l = store.get("lang") || "en"; }
  const switching = l !== lang || !cache[l];
  try {
    await useLang(l);
  } catch {
    show("cards", "today");
    $("pos").textContent = "단어 데이터를 불러오지 못했습니다. 새로고침해 주세요.";
    return;
  }
  store.set("lang", lang);
  $("fill").style.width = "0";
  $("sort").options[1].textContent = lang === "de" ? "Niveau" : "Importance";
  $("q").placeholder = lang === "de" ? "Wort oder Bedeutung suchen" : "Search words or meanings";
  $("q").setAttribute("aria-label", $("q").placeholder);
  if (view === "days") { deck = null; renderDays(); show("days", "days"); }
  else if (view === "list") {
    deck = null;
    if (!cache[lang].rows) cache[lang].rows = buildRows();
    if (switching || $("rows").firstChild?.dataset?.lang !== lang) { $("q").value = ""; sortRows(); filterRows(); }
    show("list", "list");
  }
  else if (view === "day") openDeck(dayDeck(arg || allDays()[0].id), "days");
  else openDeck(todayDeck(), "today");
}

/* theme */
function syncBar() {
  const bar = getComputedStyle(document.documentElement).getPropertyValue("--bar").trim();
  document.querySelector('meta[name="theme-color"]').content = bar;
}
function setTheme(mode) {
  if (mode === "light" || mode === "dark") document.documentElement.dataset.theme = mode;
  else delete document.documentElement.dataset.theme;
  store.set("theme", mode === "system" ? null : mode);
  syncBar();
}
setTheme(store.get("theme") || "system");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncBar);

/* settings */
document.querySelectorAll("[data-flag]").forEach((s) => { s.innerHTML = FLAGS[s.dataset.flag]; });
function openSettings() {
  document.querySelector(`input[name="lang"][value="${lang}"]`).checked = true;
  document.querySelector(`input[name="theme"][value="${store.get("theme") || "system"}"]`).checked = true;
  $("settings").showModal();
}
$("now").onclick = openSettings;
$("settings-btn").onclick = openSettings;
$("settings-close").onclick = () => $("settings").close();
$("settings").addEventListener("click", (e) => { if (e.target === $("settings")) $("settings").close(); });
document.querySelectorAll('input[name="theme"]').forEach((r) => r.addEventListener("change", () => setTheme(r.value)));
document.querySelectorAll('input[name="lang"]').forEach((r) => r.addEventListener("change", () => {
  // keep the same tab; day ids differ between languages, so a day deck falls back to the day list
  const tab = document.querySelector('.tabs a[aria-current="page"]')?.dataset.tab || "today";
  $("settings").close();
  location.hash = `#/${r.value}/${tab}`;
}));

/* input */
$("flip").onclick = toggle;
$("prev").onclick = () => move(-1);
$("next").onclick = () => move(1);
addEventListener("hashchange", route);
addEventListener("keydown", (e) => {
  if (!deck || $("sheet").open || $("settings").open || ["SELECT", "INPUT"].includes(e.target.tagName)) return;
  if (e.key === "ArrowRight") move(1);
  else if (e.key === "ArrowLeft") move(-1);
  else if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); toggle(); }
});

let startX = null, startY = 0, dragging = false;
const stage = $("stage"), slide = $("slide");
function endDrag() {
  startX = null;
  dragging = false;
  slide.classList.remove("drag");
}
stage.addEventListener("pointerdown", (e) => {
  if (e.target.closest("button, summary, details")) return;
  startX = e.clientX; startY = e.clientY; dragging = false;
});
stage.addEventListener("pointermove", (e) => {
  if (startX === null || busy) return;
  const dx = e.clientX - startX, dy = e.clientY - startY;
  if (!dragging && Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
    dragging = true;
    slide.classList.add("drag");
    stage.setPointerCapture(e.pointerId);
  }
  if (dragging) slide.style.transform = `translateX(${dx}px) rotate(${dx / 50}deg)`;
});
stage.addEventListener("pointerup", (e) => {
  if (startX === null) return;
  const dx = e.clientX - startX, dy = e.clientY - startY, wasDragging = dragging;
  endDrag();
  if (wasDragging) {
    if (Math.abs(dx) > 70) move(dx < 0 ? 1 : -1);
    else slide.style.transform = "";
  } else if (Math.abs(dx) < 10 && Math.abs(dy) < 10 && !isDone()) setFlip(!flipped);
});
stage.addEventListener("pointercancel", () => { endDrag(); slide.style.transform = ""; });

route();
</script>
</body>
